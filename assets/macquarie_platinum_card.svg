<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <!-- Card Rounded Clip -->
    <clipPath id="cardCorners">
      <rect x="0" y="0" width="856" height="540" rx="36" ry="36"/>
    </clipPath>

    <!-- Clip for Coin Medallion -->
    <clipPath id="coinClip">
      <circle cx="670" cy="115" r="175"/>
    </clipPath>

    <!-- Radial Background Gradient for Card -->
    <radialGradient id="cardDarkGlow" cx="70%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#24252a"/>
      <stop offset="45%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <!-- Coin Metallic Gradients -->
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ecf1"/>
      <stop offset="25%" stop-color="#b8bec8"/>
      <stop offset="50%" stop-color="#7e8590"/>
      <stop offset="75%" stop-color="#a4abb5"/>
      <stop offset="100%" stop-color="#555a64"/>
    </linearGradient>

    <radialGradient id="coinRelief" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d6dbe2"/>
      <stop offset="40%" stop-color="#9aa1ac"/>
      <stop offset="80%" stop-color="#585e68"/>
      <stop offset="100%" stop-color="#2c3038"/>
    </radialGradient>

    <!-- Macquarie Logo Ring Gradient (Iridescent Pearl) -->
    <linearGradient id="macquarieRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Surface Specular Light -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardCorners)">
    <!-- Base Card Surface -->
    <rect x="0" y="0" width="856" height="540" fill="url(#cardDarkGlow)"/>

    <!-- Concentric Engraved Lathe / Vinyl Rings centered on the Coin -->
    <g fill="none" stroke-linecap="round">
      <!-- Radiating fine grooves from coin center (cx: 670, cy: 115) -->
      <circle cx="670" cy="115" r="185" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.14"/>
      <circle cx="670" cy="115" r="195" stroke="#000000" stroke-width="2.5" stroke-opacity="0.6"/>
      <circle cx="670" cy="115" r="205" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.10"/>
      <circle cx="670" cy="115" r="215" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
      <circle cx="670" cy="115" r="225" stroke="#000000" stroke-width="2.8" stroke-opacity="0.7"/>
      <circle cx="670" cy="115" r="238" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.12"/>
      <circle cx="670" cy="115" r="250" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.22"/>
      <circle cx="670" cy="115" r="262" stroke="#000000" stroke-width="3" stroke-opacity="0.75"/>
      <circle cx="670" cy="115" r="275" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.15"/>
      <circle cx="670" cy="115" r="290" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.24"/>
      <circle cx="670" cy="115" r="305" stroke="#000000" stroke-width="3.5" stroke-opacity="0.8"/>
      <circle cx="670" cy="115" r="320" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.26"/>
      <circle cx="670" cy="115" r="338" stroke="#000000" stroke-width="3.5" stroke-opacity="0.8"/>
      <circle cx="670" cy="115" r="355" stroke="#ffffff" stroke-width="2" stroke-opacity="0.18"/>
      <circle cx="670" cy="115" r="375" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.28"/>
      <circle cx="670" cy="115" r="395" stroke="#000000" stroke-width="4" stroke-opacity="0.85"/>
      <circle cx="670" cy="115" r="415" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.18"/>
      <circle cx="670" cy="115" r="435" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.26"/>
      <circle cx="670" cy="115" r="458" stroke="#000000" stroke-width="4.5" stroke-opacity="0.85"/>
      <circle cx="670" cy="115" r="480" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.16"/>
      <circle cx="670" cy="115" r="505" stroke="#ffffff" stroke-width="3.8" stroke-opacity="0.25"/>
      <circle cx="670" cy="115" r="530" stroke="#000000" stroke-width="4.5" stroke-opacity="0.9"/>
      <circle cx="670" cy="115" r="555" stroke="#ffffff" stroke-width="2.6" stroke-opacity="0.17"/>
      <circle cx="670" cy="115" r="585" stroke="#ffffff" stroke-width="4.2" stroke-opacity="0.24"/>
      <circle cx="670" cy="115" r="615" stroke="#000000" stroke-width="5" stroke-opacity="0.9"/>
      <circle cx="670" cy="115" r="645" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.16"/>
      <circle cx="670" cy="115" r="680" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.22"/>
      <circle cx="670" cy="115" r="715" stroke="#000000" stroke-width="5.5" stroke-opacity="0.9"/>
      <circle cx="670" cy="115" r="750" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.18"/>
      <circle cx="670" cy="115" r="790" stroke="#ffffff" stroke-width="5" stroke-opacity="0.22"/>
      <circle cx="670" cy="115" r="835" stroke="#000000" stroke-width="6" stroke-opacity="0.95"/>
      <circle cx="670" cy="115" r="880" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.15"/>
      <circle cx="670" cy="115" r="930" stroke="#ffffff" stroke-width="5" stroke-opacity="0.2"/>
    </g>

    <!-- Antique Silver Macquarie Coin Medallion in Top Right -->
    <g clip-path="url(#coinClip)">
      <!-- Coin Base -->
      <circle cx="670" cy="115" r="175" fill="url(#coinRelief)"/>

      <!-- Coin Outer Rim & Dentil Border -->
      <circle cx="670" cy="115" r="168" fill="none" stroke="#252830" stroke-width="4"/>
      <circle cx="670" cy="115" r="162" fill="none" stroke="#d5dbe3" stroke-width="2" stroke-opacity="0.8"/>
      <circle cx="670" cy="115" r="156" fill="none" stroke="#333742" stroke-width="3"/>

      <!-- Dentils / Beaded Border Pattern -->
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
        <line x1="670" y1="-40" x2="670" y2="-34"/>
        <line x1="720" y1="-35" x2="717" y2="-29"/>
        <line x1="770" y1="-20" x2="765" y2="-15"/>
        <line x1="815" y1="10" x2="808" y2="13"/>
        <line x1="845" y1="50" x2="837" y2="52"/>
        <line x1="860" y1="95" x2="852" y2="96"/>
        <line x1="860" y1="145" x2="852" y2="144"/>
        <line x1="845" y1="190" x2="838" y2="187"/>
        <line x1="815" y1="230" x2="809" y2="225"/>
        <line x1="770" y1="260" x2="765" y2="253"/>
        <line x1="720" y1="275" x2="717" y2="268"/>
        <line x1="670" y1="280" x2="670" y2="272"/>
        <line x1="620" y1="275" x2="623" y2="268"/>
        <line x1="570" y1="260" x2="575" y2="253"/>
        <line x1="525" y1="230" x2="531" y2="225"/>
        <line x1="495" y1="190" x2="502" y2="187"/>
        <line x1="480" y1="145" x2="488" y2="144"/>
        <line x1="480" y1="95" x2="488" y2="96"/>
        <line x1="495" y1="50" x2="503" y2="52"/>
        <line x1="525" y1="10" x2="531" y2="13"/>
        <line x1="570" y1="-20" x2="575" y2="-15"/>
        <line x1="620" y1="-35" x2="623" y2="-29"/>
      </g>

      <!-- Inner Circular Ridge -->
      <circle cx="670" cy="115" r="140" fill="none" stroke="#22252c" stroke-width="3"/>
      <circle cx="670" cy="115" r="137" fill="none" stroke="#e0e5ed" stroke-width="2" stroke-opacity="0.8"/>

      <!-- Embossed Latin Letters on the Coin Periphery -->
      <g font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="bold" fill="#3a3f4a" stroke="#d5dbe3" stroke-width="0.8">
        <text x="548" y="165" transform="rotate(-52 548 165)">C</text>
        <text x="560" y="125" transform="rotate(-38 560 125)">A</text>
        <text x="578" y="90" transform="rotate(-24 578 90)">R</text>
        <text x="602" y="60" transform="rotate(-10 602 60)">O</text>
        <text x="632" y="38" transform="rotate(4 632 38)">L</text>
        <text x="664" y="28" transform="rotate(18 664 28)">U</text>
        <text x="696" y="28" transform="rotate(32 696 28)">S</text>
        <text x="732" y="38" transform="rotate(48 732 38)">•</text>
        <text x="758" y="58" transform="rotate(62 758 58)">I</text>
        <text x="778" y="80" transform="rotate(74 778 80)">I</text>
        <text x="794" y="105" transform="rotate(86 794 105)">I</text>
        <text x="796" y="145" transform="rotate(108 796 145)">•</text>
        <text x="778" y="195" transform="rotate(130 778 195)">1</text>
        <text x="750" y="228" transform="rotate(145 750 228)">8</text>
        <text x="715" y="250" transform="rotate(160 715 250)">0</text>
        <text x="675" y="260" transform="rotate(178 675 260)">•</text>
      </g>

      <!-- Center Embossed Historic Coin Relief (Spanish Charles bust / antique medallion center) -->
      <g transform="translate(670, 115)">
        <circle cx="0" cy="0" r="102" fill="none" stroke="#252932" stroke-width="3"/>
        <circle cx="0" cy="0" r="100" fill="url(#silverSheen)"/>
        
        <!-- Detailed Antique Bust Relief Silhouette with Silver Highlights -->
        <path d="M-22,-45 C-12,-55 8,-58 24,-48 C36,-38 42,-22 38,-6 C35,6 26,18 32,32 C36,40 46,48 55,56 C40,65 18,72 -5,72 C-32,72 -54,60 -62,45 C-56,38 -45,34 -38,28 C-30,22 -32,10 -35,-2 C-38,-16 -34,-32 -22,-45 Z" 
              fill="#747c87" stroke="#3d434d" stroke-width="2"/>
        <path d="M-18,-42 C-9,-50 9,-52 22,-44 C32,-35 37,-22 34,-8 C31,3 23,14 28,27 C32,34 40,41 48,48 C36,55 18,62 -2,62 C-25,62 -44,52 -51,39 C-45,33 -36,29 -30,24 C-24,19 -26,9 -29,-2 C-32,-13 -28,-28 -18,-42 Z" 
              fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
        <path d="M-5,-28 C5,-32 18,-28 22,-18 C25,-10 20,-2 14,5 C6,12 -2,18 -8,25" 
              fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.75"/>
        <circle cx="6" cy="-15" r="4" fill="#ffffff" fill-opacity="0.8"/>
      </g>

      <!-- Coin Metallic Highlight Arc -->
      <path d="M520,80 A165,165 0 0,1 780,5" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.45"/>
    </g>

    <!-- Top Left: Macquarie Bank Logo -->
    <g transform="translate(62, 54)">
      <!-- Macquarie Circular Ring (Silver Iridescent Sheen) -->
      <circle cx="28" cy="28" r="25" fill="none" stroke="url(#macquarieRing)" stroke-width="5.5"/>
      <circle cx="28" cy="28" r="16.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Inner subtle rainbow flare reflection on ring -->
      <path d="M12,28 A16,16 0 0,1 28,12" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-opacity="0.4"/>
      <path d="M28,12 A16,16 0 0,1 44,28" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-opacity="0.4"/>

      <!-- Text: MACQUARIE -->
      <text x="68" y="37" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2.2">MACQUARIE</text>
    </g>

    <!-- Top Right: "platinum" text -->
    <text x="735" y="90" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="21" font-weight="500" fill="#ffffff" fill-opacity="0.82" letter-spacing="0.5" text-anchor="end">platinum</text>

    <!-- Card Center: "debit" text -->
    <text x="338" y="235" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="500" fill="#ffffff" fill-opacity="0.95" letter-spacing="0.8">debit</text>

    <!-- Bottom Left: Card Number "••8515" -->
    <g transform="translate(62, 395)">
      <!-- Distinct bullet points •• -->
      <circle cx="10" cy="18" r="4.5" fill="#ffffff"/>
      <circle cx="28" cy="18" r="4.5" fill="#ffffff"/>
      <text x="44" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="30" font-weight="600" fill="#ffffff" letter-spacing="2.5">8515</text>
    </g>

    <!-- Bottom Right: Iconic Mastercard Red & Orange-Yellow Logo -->
    <g transform="translate(685, 390)">
      <!-- Red Circle -->
      <circle cx="36" cy="36" r="36" fill="#EB001B"/>
      <!-- Orange-Yellow Circle -->
      <circle cx="82" cy="36" r="36" fill="#F79E1B"/>
      <!-- Overlapping Lens Blend -->
      <path d="M59 13.8 A36 36 0 0 1 59 58.2 A36 36 0 0 1 59 13.8 Z" fill="#FF5F00"/>
    </g>

    <!-- Subtle Premium Surface Glass Reflection -->
    <rect x="0" y="0" width="856" height="540" fill="url(#specularGleam)" pointer-events="none"/>

    <!-- Subtle Edge Bevel Highlight -->
    <rect x="1.5" y="1.5" width="853" height="537" rx="35" ry="35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" pointer-events="none"/>
  </g>
</svg>
